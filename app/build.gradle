plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // If using Koin:
    id "org.jetbrains.kotlin.kapt" // if needed
    id("com.google.devtools.ksp")
    id 'com.google.firebase.crashlytics'
    id 'com.google.gms.google-services'
}

android {
    namespace "com.example.xchat2"
    compileSdkVersion = 35 // latest stable

    defaultConfig {
        applicationId "com.example.xchat2"
        minSdkVersion 21 // or lower if you want to be a hero
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.15" // latest stable compose compiler
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"

    // Compose BOM to align versions
    implementation platform("androidx.compose:compose-bom:2025.01.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation 'androidx.compose.runtime:runtime-livedata:1.7.6'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation "androidx.room:room-runtime:2.6.1"
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    ksp "androidx.room:room-compiler:2.6.1" // Required for annotation processing

    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation 'com.google.firebase:firebase-crashlytics:18.4.1'

    // Activity Compose
    implementation "androidx.activity:activity-compose:1.9.3"

    // Navigation Compose
    implementation "androidx.navigation:navigation-compose:2.8.5"

    // Other AndroidX libs if needed
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"

    // If you need ViewModel support in Compose
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "org.jsoup:jsoup:1.13.1"
    // Koin DI
    implementation "io.insert-koin:koin-android:3.4.0"
    // For Compose Koin integration if needed
    implementation "io.insert-koin:koin-androidx-compose:3.5.0"

    // Networking/other libs here

    // Unit Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform("androidx.compose:compose-bom:2023.09.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
